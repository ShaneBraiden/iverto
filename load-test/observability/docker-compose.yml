# Optional live dashboard for k6 runs.
#
#   docker compose -f observability/docker-compose.yml up -d
#   # then run k6 with the Prometheus remote-write output:
#   k6 run -o experimental-prometheus-rw \
#          -e K6_PROMETHEUS_RW_SERVER_URL=http://localhost:9090/api/v1/write \
#          k6/load.js
#
# Grafana: http://localhost:3001  (admin / admin)
#   Add a Prometheus data source at http://prometheus:9090, then import
#   dashboard ID 19665 ("k6 Prometheus") from grafana.com.
#
# The end-of-test text summary and --summary-export JSON work with no docker at
# all; this is only for watching latency/throughput move in real time.

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
