global:
  scrape_interval: 5s

# k6 pushes via remote write (--web.enable-remote-write-receiver on the server).
# No scrape jobs needed for k6 itself. Add the API host here if you also want
# to pull its /metrics endpoint during a run.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
